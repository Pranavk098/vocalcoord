name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Run from the repo root: backend/main.py and the test suite import via
      # `from backend.x import y`, which only resolves with repo root as CWD.
      - name: Run tests
        run: python -m pytest backend/tests/ -v

      # No ruff config exists yet, so this repo hasn't been linted before.
      # Run non-blocking for now so it reports without failing CI on
      # pre-existing style issues.
      - name: Lint (ruff)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check backend/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build
